name: MMARecomp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  MMARecomp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MMARecomp
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: MMARecomp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MMA Recomp
    settings:
      base:
        # APP_IDENTIFIER doit être exporté avant `xcodegen generate` (en local
        # ou en CI) — même variable que celle lue par fastlane/Appfile et
        # fastlane/Matchfile, pour n'avoir qu'une seule source de vérité.
        PRODUCT_BUNDLE_IDENTIFIER: "${APP_IDENTIFIER}"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "${TEAM_ID}"
        CODE_SIGN_STYLE: Manual
