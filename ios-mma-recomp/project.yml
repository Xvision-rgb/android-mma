name: MMARecomp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  MMARecomp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MMARecomp
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: MMARecomp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: MMA Recomp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mmarecomp
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
